<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="description" content="AI Business Core workspace"><title>AI Business Core | فضای کار هوشمند</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"><a class="brand" href="#overview"><span class="brand-mark">A</span><span><strong>AI Business Core</strong><small>مرکز مدیریت کسب‌وکار</small></span></a><nav class="main-nav" aria-label="ناوبری اصلی"><button class="nav-item active" data-view="overview">◫ &nbsp; نمای کلی</button><button class="nav-item" data-view="tasks">✓ &nbsp; مدیریت وظایف <b id="nav-task-count">0</b></button><button class="nav-item" data-view="research">⌕ &nbsp; کتابخانه پژوهش</button><button class="nav-item" data-view="ai">✦ &nbsp; استودیو هوش مصنوعی</button><button class="nav-item" data-view="content">▤ &nbsp; استودیو محتوا</button><button class="nav-item" data-view="calendar">▦ &nbsp; تقویم و زمان‌بندی</button><button class="nav-item" data-view="approvals">◉ &nbsp; صف تأییدها <b id="nav-approval-count">0</b></button></nav><div class="sidebar-bottom"><div class="local-status"><span class="status-dot"></span><div><strong>فضای کاری محلی</strong><small>ذخیره‌شده در این مرورگر</small></div></div><button class="nav-item" data-view="settings">⚙ &nbsp; تنظیمات و داده‌ها</button></div></aside><main class="main-area"><header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="باز و بسته کردن منو">☰</button><div class="breadcrumb">فضای کاری <span>/</span> <strong id="breadcrumb-current">نمای کلی</strong></div><div class="topbar-right"><span id="today-label" class="date-label"></span><span class="avatar" aria-label="حساب کاربری">م</span></div></header><div id="view-root" class="view-root" tabindex="-1"></div><footer class="app-footer"><span>AI BUSINESS CORE</span><span>اقدام‌های بیرونی نیازمند تأیید مدیر هستند</span></footer></main></div><dialog id="item-dialog" class="modal"><form method="dialog" id="item-form"><div class="modal-head"><div><p class="eyebrow" id="dialog-eyebrow">فضای کاری</p><h2 id="dialog-title">افزودن مورد</h2></div><button class="icon-button" value="cancel" aria-label="بستن پنجره">×</button></div><div id="dialog-fields" class="form-fields"></div><div class="modal-actions"><button class="button secondary" value="cancel">انصراف</button><button class="button primary" id="dialog-save" value="default">ذخیره مورد</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="app-update-banner" role="status" aria-live="polite" style="display:none;position:fixed;inset:0 0 auto 0;z-index:99999;padding:18px;text-align:center;background:#155eaa;color:#fff;font:600 15px sans-serif;box-shadow:0 4px 18px #0005">در حال بروزرسانی برنامه…</div><script src="app.js" defer></script><script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", async () => {
    const banner = document.getElementById("app-update-banner");
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      if (banner) { banner.textContent = "بروزرسانی انجام شد؛ برنامه در حال بارگذاری است…"; banner.style.display = "block"; }
      window.location.reload();
    });
    try {
      const registration = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
      await registration.update();
      if (registration.installing) {
        if (banner) { banner.textContent = "در حال بروزرسانی برنامه…"; banner.style.display = "block"; }
      }
      registration.addEventListener("updatefound", () => {
        const worker = registration.installing;
        if (banner) { banner.textContent = "نسخه جدید پیدا شد؛ در حال بروزرسانی…"; banner.style.display = "block"; }
        if (worker) worker.addEventListener("statechange", () => {
          if (worker.state === "installed" && navigator.serviceWorker.controller) {
            if (banner) banner.textContent = "نسخه جدید آماده شد؛ در حال اعمال بروزرسانی…";
          }
        });
      });
    } catch (error) { console.warn("App update check failed", error); }
  });
}
</script></body></html>

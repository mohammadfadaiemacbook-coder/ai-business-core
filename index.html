button class="nav-item" type="button" data-view="settings"><span>⚙</span>تنظیمات و اتصال‌ها</button></nav><div class="sidebar-bottom"><div class="local-status"><span class="status-dot"></span><div><strong>فضای کاری محلی</strong><small>داده‌ها ابتدا روی همین دستگاه ذخیره می‌شوند.</small></div></div></div></aside><button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="بستن منو" data-action="close-menu"></button><main class="main-area"><header class="topbar"><a class="home-brand" href="./" aria-label="صفحه اصلی"><span class="brand-mark">A</span><strong>AI Business Core</strong><small>مرکز مدیریت کسب‌وکار</small></a><div class="breadcrumb">فضای کاری <span>/</span> <strong id="breadcrumb-current">نمای کلی</strong></div><div class="topbar-right"><button class="mobile-menu" type="button" aria-label="باز کردن منو" data-action="toggle-menu">☰</button><span id="today-label" class="date-label"></span><button class="button secondary small" type="button" data-view="settings">تنظیمات اتصال</button><button id="web-update-check" class="button secondary small" type="button" title="بررسی نسخه جدید و تازه‌سازی برنامه">↻ بروزرسانی وب</button><span class="avatar" aria-label="حساب کاربری">م</span></div></header><div id="view-root" class="view-root" tabindex="-1"></div><footer class="app-footer"><span>AI BUSINESS CORE</span><span>اقدام‌های بیرونی نیازمند تأیید مدیر هستند</span></footer></main></div><dialog id="item-dialog" class="modal"><form method="dialog" id="item-form"><div class="modal-head"><div><p class="eyebrow" id="dialog-eyebrow">فضای کاری</p><h2 id="dialog-title">افزودن مورد</h2></div><button class="icon-button" value="cancel" aria-label="بستن پنجره">×</button></div><div id="dialog-fields" class="form-fields"></div><div class="modal-actions"><button class="button secondary" value="cancel">انصراف</button><button class="button primary" id="dialog-save" value="default">ذخیره مورد</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="web-update-banner" role="status" aria-live="polite" style="display:none;position:fixed;inset:0 0 auto 0;z-index:100000;padding:14px;text-align:center;background:#155eaa;color:#fff;font:600 15px sans-serif;box-shadow:0 4px 18px #0005"><span>نسخه جدید برنامه آماده نصب است.</span> <button id="web-update-apply" type="button" style="margin:8px;padding:10px 16px;border:0;border-radius:10px;background:#fff;color:#123;font-weight:700">اعمال بروزرسانی</button> <button id="web-update-dismiss" type="button" style="margin:6px;padding:9px 12px;border:1px solid #ffffff88;border-radius:10px;background:transparent;color:#fff">بعداً</button></div><script src="app.js" defer></script><script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", async () => {
    const banner = document.getElementById("web-update-banner");
    const apply = document.getElementById("web-update-apply");
    const dismiss = document.getElementById("web-update-dismiss");
    const manualUpdate = document.getElementById("web-update-check");
    let registration = null;
    let reloading = false;
    const showUpdate = () => { if (banner) banner.style.display = "block"; };
    const hideUpdate = () => { if (banner) banner.style.display = "none"; };
    apply?.addEventListener("click", () => {
      if (registration?.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
      else registration?.update().catch(error => console.warn("Update check failed", error));
    });
    dismiss?.addEventListener("click", hideUpdate);
    manualUpdate?.addEventListener("click", async () => {
      if (!manualUpdate || manualUpdate.disabled) return;
      const originalLabel = manualUpdate.textContent;
      manualUpdate.disabled = true;
      manualUpdate.textContent = "در حال بررسی…";
      try {
        if (!registration) registration = await navigator.serviceWorker.getRegistration("./");
        if (registration) {
          await registration.update();
          if (registration.waiting) {
            showUpdate();
            registration.waiting.postMessage({ type: "SKIP_WAITING" });
            return;
          }
          if (registration.installing) {
            const installing = registration.installing;
            installing.addEventListener("statechange", () => {
              if (installing.state === "installed") {
                showUpdate();
                if (registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
              }
            });
            return;
          }
        }
        window.location.reload();
      } catch (error) {
        console.warn("Manual app update failed", error);
        manualUpdate.disabled = false;
        manualUpdate.textContent = originalLabel;
        alert("بررسی بروزرسانی انجام نشد. اتصال اینترنت را بررسی و دوباره تلاش کن.");
      }
    });
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
    try {
      registration = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
      if (registration.waiting && navigator.serviceWorker.controller) showUpdate();
      registration.addEventListener("updatefound", () => {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener("statechange", () => {
          if (worker.state === "installed" && navigator.serviceWorker.controller) showUpdate();
        });
      });
      await registration.update();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") registration.update().catch(error => console.warn("Update check failed", error));
      });
      window.setInterval(() => registration.update().catch(error => console.warn("Update check failed", error)), 30 * 60 * 1000);
    } catch (error) { console.warn("App update check failed", error); }
  });
}

;
</script></body></html>

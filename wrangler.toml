name = "ai-business-core"
main = "ai-gateway/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ai-business-core-db"
database_id = "a2efe780-1b52-4a56-9bfe-aa0ec531842e"
migrations_dir = "migrations"

# Preview uses a dedicated staging database and never shares production data.
[[previews.d1_databases]]
binding = "DB"
database_name = "ai-business-core-preview"
database_id = "e709fe6a-6fc3-40c7-b623-3bda290503c9"
migrations_dir = "migrations"

name = "ai-business-core"
main = "ai-gateway/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ai-business-core-db"
database_id = "a2efe780-1b52-4a56-9bfe-aa0ec531842e"
migrations_dir = "migrations"

# Cloudflare Preview uses the existing production D1 database by explicit owner choice.
# No separate preview database is created or provisioned.
[[previews.d1_databases]]
binding = "DB"
database_name = "ai-business-core-db"
database_id = "a2efe780-1b52-4a56-9bfe-aa0ec531842e"

name = "ai-business-core"
main = "ai-gateway/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ai-business-core-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

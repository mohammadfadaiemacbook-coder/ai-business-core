name: Build Android APK

on:
  push:
    branches: [main, "feat/android15-apk", "feat/v2-social-automation-foundation"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 35 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project configuration
        working-directory: android
        run: |
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          gradle --version

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --warning-mode all -PversionCode=${GITHUB_RUN_NUMBER} -PversionName=1.0.${GITHUB_RUN_NUMBER} assembleDebug

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-business-core-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Android debug builds must never replace the latest macOS release.
      - name: Publish Android testing release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android test build 1.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android preview APK

on:
  push:
    branches: ["feature/security-expo-hardening"]
    paths:
      - "native/expo/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'

      - name: Install Expo dependencies
        working-directory: native/expo
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        working-directory: native/expo
        run: npx expo config --type public

      - name: Generate native Android project
        working-directory: native/expo
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable debug APK
        working-directory: native/expo/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-business-core-expo-preview-apk
          path: native/expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build Android preview APK

on:
  push:
    branches: ["feature/security-expo-hardening"]
    paths:
      - "native/expo/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Expo dependencies
        working-directory: native/expo
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        working-directory: native/expo
        run: npx expo config --type public

      - name: Generate native Android project
        working-directory: native/expo
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        timeout-minutes: 25
        working-directory: native/expo/android
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 --console=plain assembleDebug

      - name: Verify APK and checksum
        run: |
          test -s native/expo/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum native/expo/android/app/build/outputs/apk/debug/app-debug.apk | tee native/expo/android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-business-core-expo-preview-apk
          path: |
            native/expo/android/app/build/outputs/apk/debug/app-debug.apk
            native/expo/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

name: Build Nexora AI for macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/build-macos.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
       - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
      - name: Build universal macOS DMG
        run: npm run dist:mac
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-macos-universal-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

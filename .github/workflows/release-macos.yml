name: Publish Nexora AI macOS update

on:
  push:
    tags:
      - "mac-v*"

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify tag matches app version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#mac-v}"
          test "$VERSION" = "$TAG_VERSION" || { echo "Tag $TAG_VERSION does not match package version $VERSION"; exit 1; }
      - name: Build and publish universal DMG
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish Nexora AI macOS update

on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to upload the DMG to"
        required: true
        default: "mac-v1.0.2"

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify release tag matches app version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_VERSION="${TAG#mac-v}"
          test "$VERSION" = "$TAG_VERSION" || { echo "Tag $TAG_VERSION does not match package version $VERSION"; exit 1; }
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build universal DMG without implicit publishing
        run: npm run release:mac
      - name: Upload installer to the matching GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.blockmap --clobber --repo mohammadfadaiemacbook-coder/ai-business-core

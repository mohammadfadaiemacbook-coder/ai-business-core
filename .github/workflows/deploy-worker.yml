name: Deploy Worker

on:
  push:
    branches: [main, fix/worker-deploy]
    paths:
      - "ai-gateway/**"
      - "wrangler.jsonc"
      - ".assetsignore"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check ai-gateway/worker.js
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

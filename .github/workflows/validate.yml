name: Validate dashboard
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify app shell files
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'rel="manifest"' index.html
          grep -q 'serviceWorker.register' index.html

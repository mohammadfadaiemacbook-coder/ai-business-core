name: Validate dashboard
on:
  push:
    branches: [main, "build/**", "feature/**", "feat/**"]
  # Also validate stacked operational PRs targeting audit/** or build/**.
  pull_request:
    branches: [main, "feature/**", "feat/**", "audit/**", "build/**", "fix/**"]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          if [ -f renderer/agent.mjs ]; then node --check renderer/agent.mjs; bash -n renderer/install-mac.sh; fi
          node --input-type=module --check < ai-gateway/worker.js
          node --test tests/*.mjs
      - name: Validate Cloudflare Worker bundle and static assets
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/aibc-wrangler-dry-run
      - name: Verify app shell and AI gateway files
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          test -s icons/icon.svg
          test -s icons/icon-maskable.svg
          test -s ai-gateway/worker.js
          test -s ai-gateway/mcp-readonly.js
          test -s migrations/0009_app_runtime_errors.sql
          test -s docs/runtime-diagnostics.md
          if [ -f renderer/agent.mjs ]; then test -s renderer/agent.mjs; test -s renderer/.env.example; test -s migrations/0008_youtube_media_renderer.sql; fi
          test -s ai-gateway/wrangler.toml.example
          test -s docs/ai-gateway-setup.md
          node -e "const m=JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); if(!Array.isArray(m.icons)||m.icons.length<2) process.exit(1); for(const i of m.icons) if(!i.src||!i.type||!i.purpose) process.exit(1)"
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'rel="manifest"' index.html
          grep -q 'serviceWorker.register' index.html

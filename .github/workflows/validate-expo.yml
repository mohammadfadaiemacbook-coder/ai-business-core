name: Validate Expo native client

on:
  pull_request:
    branches: [main, "feature/security-expo-hardening"]
    paths:
      - "native/expo/**"
      - ".github/workflows/validate-expo.yml"
  push:
    branches: ["feature/security-expo-hardening"]
    paths:
      - "native/expo/**"
      - ".github/workflows/validate-expo.yml"

permissions:
  contents: read

jobs:
  expo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Detect whether this branch includes the Expo client
        id: expo
        shell: bash
        run: |
          if [[ -f native/expo/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Expo client dependencies
        if: steps.expo.outputs.present == 'true'
        working-directory: native/expo
        run: npm install --no-audit --no-fund
      - name: Validate Expo configuration
        if: steps.expo.outputs.present == 'true'
        working-directory: native/expo
        run: npx expo config --type public
      - name: Check SDK dependency compatibility
        if: steps.expo.outputs.present == 'true'
        working-directory: native/expo
        run: npx expo install --check
      - name: Run Expo Doctor
        if: steps.expo.outputs.present == 'true'
        working-directory: native/expo
        run: npx expo-doctor
      - name: Type-check native client
        if: steps.expo.outputs.present == 'true'
        working-directory: native/expo
        run: npm run typecheck

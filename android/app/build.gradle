plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aibusinesscore.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aibusinesscore.app'
        minSdk 23
        targetSdk 35
        versionCode providers.gradleProperty('versionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('1.0.0')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
